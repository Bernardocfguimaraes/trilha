services:
  - type: web
    name: trilha-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        value: sqlite:///trilha.db
      - key: PROFESSOR_NOME
        value: Profa. Marina
      - key: PROFESSOR_EMAIL
        sync: false
      - key: PROFESSOR_SENHA
        sync: false
      - key: TRILHA_SEGREDO
        generateValue: true
      - key: TRILHA_CORS
        sync: false
      - key: TRILHA_CORS_REGEX
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_REVISOR_MODEL
        value: qwen/qwen3.8-27b
